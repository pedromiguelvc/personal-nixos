# ==========================
# GENERAL
# ==========================
set-environment -g DISPLAY ":0"

set -g allow-passthrough on

set -g status-interval 30

set-option -g renumber-windows on

set -s copy-command 'wl-copy'

set -g cursor-style underline

set -as terminal-feature ',*:RGB'


# ==========================
# KEYBINDS
# ==========================

unbind-key %
unbind-key '"'
unbind-key [


# Copy mode (vi)
bind-key -T copy-mode-vi y send -X copy-pipe "wl-copy"
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi C-v send -X begin-selection \; send -X rectangle-toggle
bind-key -T copy-mode-vi Escape send -X clear-selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X stop-selection

bind-key -T copy-mode-vi Up send -X scroll-up
bind-key -T copy-mode-vi Down send -X scroll-down

bind-key -T copy-mode-vi H send -X start-of-line
bind-key -T copy-mode-vi L send -X end-of-line


# Normal mode
bind-key -n M-v copy-mode
bind-key -n M-d detach-client

bind-key -n C-n next-window
bind-key -n C-p previous-window

bind-key -n M-0 last-window
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

bind-key -n M-s switch-client -l

# Windows split
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind-key n new-session -c "#{pane_current_path}"

# ==========================
# POPUPS/PANES
# ==========================

bind-key o if -F '#{pane_floating_flag}' \
  'kill-pane' \
  'new-pane -x 50% -y 50% -X 25% -Y 25%'


bind-key p if -F '#{==:#{session_name},scratch}' \
  'detach-client' \
  'display-popup -E -w 80% -h 80% -T "Scratch" -d "#{pane_current_path}" "env -u TMUX tmux new-session -A -s scratch"'

# Tools

bind-key g display-popup \
  -E \
  -w 90% \
  -h 90% \
  -T "Lazygit" \
  -d "#{pane_current_path}" \
  "direnv exec . lazygit"

bind-key r display-popup \
  -E \
  -w 95% \
  -h 95% \
  -T "Tuicr" \
  -d "#{pane_current_path}" \
  "direnv exec . tuicr"

bind-key e display-popup \
  -E \
  -w 80% \
  -h 80% \
  -T "Yazi" \
  -d "#{pane_current_path}" \
  "direnv exec . yazi"


bind-key b display-popup \
  -E \
  -w 80% \
  -h 80% \
  -T "Btop" \
  "btop"

# Tmux helpers

bind-key ? display-popup \
  -E \
  -w 70% \
  -h 50% \
  -T "Bindings" \
  "tmux list-keys | sed 's/^bind-key[[:space:]]*//' | fzf"


bind-key s display-popup \
  -E \
  -w 80% \
  -h 70% \
  -T "Sessions" \
  "tmux list-sessions -F '#S' | fzf --reverse --preview 'tmux capture-pane -ep -t {}:' --preview-window 'right:60%' | xargs -r tmux switch-client -t"


bind-key w display-popup \
  -E \
  -w 80% \
  -h 70% \
  -T "Windows" \
  "tmux list-windows -a -F '#S:#I #W' | fzf --reverse --preview 'tmux capture-pane -ep -t {1}' --preview-window 'right:60%' | awk '{print \$1}' | xargs -r tmux switch-client -t"


# ==========================
# STATUS BAR
# ==========================

set-option -g status-style bg=default

set -g status-position top
set -g status on

set -g status-fg white

set -g status-justify centre

set -g status-left-length 100
set -g status-right-length 100

set -g status-left '#{tmux_mode_indicator} #[fg=white,bold]#S'

set -g status-right '#[fg=cyan] #[fg=white]#(uptime -p)'


# Windows

set -g window-status-format \
'#[fg=#565f89] #I:#{?window_last_flag,󰖰 ,}#W#{?window_zoomed_flag,  ,}'


set -g window-status-current-format \
'#[fg=#1a1b26,bg=#7aa2f7,bold] #I: #W#{?window_zoomed_flag,  , }'


# Borders

set -g pane-border-style fg="#3b4261"
set -g pane-active-border-style fg="#565f89"


# Messages

set -g message-style fg="white",bg="default",align="centre"
set -g message-command-style fg="white",bg="default",align="centre"


# Copy mode colors

set -g mode-style "bg=#35294e,fg=#f6e4cd"

set -g copy-mode-match-style \
"bg=#a6e22e,fg=black"

set -g copy-mode-current-match-style \
"bg=#ff6188,fg=white"


# ==========================
# PLUGIN SETTINGS
# ==========================

# tmux-resurrect
set -g @resurrect-strategy-nvim 'session'


# tmux-continuum
set -g @continuum-restore 'on'


# tmux-mode-indicator

set -g @mode_indicator_empty_prompt ''
set -g @mode_indicator_prefix_prompt ''
set -g @mode_indicator_copy_prompt '󰆏'
set -g @mode_indicator_sync_prompt ''

set -g @mode_indicator_prefix_mode_style \
"bg=default,fg=orange"

set -g @mode_indicator_copy_mode_style \
"bg=default,fg=blue"

set -g @mode_indicator_sync_mode_style \
"bg=default,fg=green"

set -g @mode_indicator_empty_mode_style \
"bg=default,fg=white"

# tmux-fzf
set-environment -g TMUX_FZF_LAUNCH_KEY "f"
set-environment -g TMUX_FZF_OPTIONS "-p -w 62% -h 38% -m"
set-environment -g TMUX_FZF_PREVIEW 1
set-environment -g TMUX_FZF_ORDER "session|window|pane|command|keybinding|clipboard|process"
